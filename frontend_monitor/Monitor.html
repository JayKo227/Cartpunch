    <script type="text/babel">
        const { useState, useEffect } = React;

        );

        const Barcode = ({ size = 24, className = "" }) => (

        const BookOpen = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></svg>
        );
        const X = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        );
        const Pencil = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /><path d="m15 5 4 4" /></svg>
        );

        // --- FIREBASE LIVE DATABASE INTEGRATION ---
        // Products will be fetched dynamically via React state.
        
        // Helper to format raw numeric string to string with comma thousands separator
        const formatNumberWithCommas = (str) => {
            if (!str) return '';
            const parts = str.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join('.');
        };

        const useLocalStorageState = (key, initialValue) => {
            const [state, setState] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.warn("Error reading localStorage", error);
                    return initialValue;
                }
            });
            useEffect(() => {
                try {
                    window.localStorage.setItem(key, JSON.stringify(state));
                } catch (error) {
                    console.warn("Error setting localStorage", error);
                }
            }, [key, state]);
            return [state, setState];
        };

        function App() {
            // --- STATE MANAGEMENT ---
            const [products, setProducts] = useState([]); // Live Firebase products
            const [screen, setScreen] = useLocalStorageState('cartpunch_monitor_screen', 'splash1');
            const [budgetMode, setBudgetMode] = useLocalStorageState('cartpunch_monitor_budgetMode', false);
            const [budget, setBudget] = useLocalStorageState('cartpunch_monitor_budget', 0);
            const [cart, setCart] = useLocalStorageState('cartpunch_monitor_cart', []);
            const [scannedItem, setScannedItem] = useState(null);
            const [itemQty, setItemQty] = useState(1);
            const [budgetInputStr, setBudgetInputStr] = useState('');
            const [manualInputType, setManualInputType] = useState('barcode');
            const [manualInputValue, setManualInputValue] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [isKeyboardVisible, setIsKeyboardVisible] = useState(true);
            const [isOnline, setIsOnline] = useState(true);

            const [hasShown70Warning, setHasShown70Warning] = useState(false);
            const [popupAlert, setPopupAlert] = useState(null); // 'limit' or 'warning70'

            // Navigation history/context for going back
            const [returnScreen, setReturnScreen] = useState(null);
            const [scanOrigin, setScanOrigin] = useState('scanning'); // Tracks where to go on Cancel
            
            // --- STATE RECOVERY SAFETY NET ---
            useEffect(() => {
                // If the user reloads the page, localStorage might restore them to a screen 
                // that requires transient state (which is reset to null/empty on reload). 
                // This prevents a blank white screen by safely returning them to the scanning screen.
                if (screen === 'item_scanned' && !scannedItem) {
                    setScreen('scanning');
                }
                if (screen === 'checkout' && cart.length === 0) {
                    setScreen('scanning');
                }
            }, [screen, scannedItem, cart, setScreen]);
            
            // --- FIREBASE SYNC EFFECT ---
            useEffect(() => {
                const productsRef = db.ref('products');
                productsRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    const loadedProducts = [];
                    if (data) {
                        Object.keys(data).forEach(key => {
                            loadedProducts.push({
                                id: key,
                                name: data[key].name || 'Unknown',
                                price: parseFloat(data[key].price) || 0,
                                stock: data[key].stock || 'High Stock'
                            });
                        });
                    }
                    setProducts(loadedProducts);
                });
                return () => productsRef.off();
            }, []);

            // Qty Pad State
            const [isQtyPadVisible, setIsQtyPadVisible] = useState(false);
            const [qtyInputStr, setQtyInputStr] = useState('1');

            // --- DERIVED STATE ---
            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // --- SPLASH SCREEN TIMERS ---
            useEffect(() => {
                if (screen === 'splash1') {
                    const timer = setTimeout(() => setScreen('tutorial'), 2500);
                    return () => clearTimeout(timer);
                }
            }, [screen]);

            // --- THANK YOU TIMER ---
            useEffect(() => {
                if (screen === 'thank_you') {
                    const timer = setTimeout(() => {
                        resetApp();
                    }, 10000); // 10 seconds before auto restart
                    return () => clearTimeout(timer);
                }
            }, [screen]);

            // --- SEARCH EFFECT ---
            useEffect(() => {
                if (!manualInputValue) {
                    setSearchResults([]);
                    return;
                }
                const lowerVal = manualInputValue.toLowerCase();
                const results = products.filter(item => {
                    if (manualInputType === 'barcode') return item.id.includes(lowerVal);
                    return item.name.toLowerCase().includes(lowerVal);
                });
                setSearchResults(results);
            }, [manualInputValue, manualInputType, products]);

            // --- DYNAMIC THEME ENGINE ---
            const defaultTheme = {
                bg: 'bg-[#FFF9F5]',
                primary: 'bg-orange-500',
                primaryHover: 'hover:bg-orange-600',
                textTitle: 'text-orange-950',
                textValue: 'text-orange-600',
                iconBg: 'bg-orange-100',
                iconColor: 'text-orange-600',
                border: 'border-orange-100',
                borderHighlight: 'border-orange-200',
                shadow: 'shadow-orange-200',
                softBg: 'bg-orange-50',
                laserBg: 'bg-orange-500',
                laserShadow: 'shadow-[0_0_20px_#f97316]',
                hoverBorder: 'hover:border-orange-500',
                hoverText: 'group-hover:text-orange-500'
            };

            const getThemeColors = () => {
                const pct = (budgetMode && budget > 0) ? (cartTotal / budget) : 0;

                if (pct >= 1) { // LIMIT REACHED: RED
                    return {
                        bg: 'bg-red-50',
                        primary: 'bg-red-500',
                        primaryHover: 'hover:bg-red-600',
                        textTitle: 'text-red-950',
                        textValue: 'text-red-600',
                        iconBg: 'bg-red-100',
                        iconColor: 'text-red-600',
                        border: 'border-red-100',
                        borderHighlight: 'border-red-200',
                        shadow: 'shadow-red-200',
                        softBg: 'bg-red-50',
                        laserBg: 'bg-red-500',
                        laserShadow: 'shadow-[0_0_20px_#ef4444]',
                        hoverBorder: 'hover:border-red-500',
                        hoverText: 'group-hover:text-red-500'
                    };
                } else if (pct >= 0.7) { // 70% REACHED: YELLOW
                    return {
                        bg: 'bg-yellow-50',
                        primary: 'bg-yellow-500',
                        primaryHover: 'hover:bg-yellow-600',
                        textTitle: 'text-yellow-900',
                        textValue: 'text-yellow-600',
                        iconBg: 'bg-yellow-100',
                        iconColor: 'text-yellow-600',
                        border: 'border-yellow-100',
                        borderHighlight: 'border-yellow-200',
                        shadow: 'shadow-yellow-200',
                        softBg: 'bg-yellow-50',
                        laserBg: 'bg-yellow-400',
                        laserShadow: 'shadow-[0_0_20px_#facc15]',
                        hoverBorder: 'hover:border-yellow-500',
                        hoverText: 'group-hover:text-yellow-500'
                    };
                } else { // DEFAULT: NEUTRAL ORANGE
                    return defaultTheme;
                }
            };
            const theme = getThemeColors();

            // --- ACTIONS ---
            const handleSimulateScan = () => {
                if (products.length === 0) return;
                const randomItem = products[Math.floor(Math.random() * products.length)];
                setScannedItem(randomItem);
                setItemQty(1);
                setScanOrigin('scanning');
                setScreen('item_scanned');
            };

            const handleManualSearch = (e) => {
                if (e) e.preventDefault();
                setIsKeyboardVisible(false);
            };

            const selectItemFromSearch = (item) => {
                setScannedItem(item);
                setItemQty(1);
                setScanOrigin('manual_input');
                setScreen('item_scanned');
            };

            const handleAddToCart = () => {
                const newItemTotal = scannedItem.price * itemQty;
                const newCartTotal = cartTotal + newItemTotal;

                if (budgetMode && newCartTotal > budget) {
                    setPopupAlert('limit');
                } else {
                    addToCartState(scannedItem, itemQty);

                    if (budgetMode && newCartTotal >= budget * 0.7 && !hasShown70Warning) {
                        setHasShown70Warning(true);
                        setPopupAlert('warning70');
                        setScreen('scanning');
                    } else {
                        setScreen('scanning');
                    }
                }
            };

            const addToCartState = (item, qty) => {
                const existing = cart.find(i => i.id === item.id);
                if (existing) {
                    setCart(cart.map(i => i.id === item.id ? { ...i, qty: i.qty + qty } : i));
                } else {
                    setCart([...cart, { ...item, qty }]);
                }
            };

            const handleRemoveFromCart = (itemId) => {
                const newCart = cart.filter(item => item.id !== itemId);
                setCart(newCart);

                const newTotal = newCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                if (budgetMode && budget > 0 && newTotal < budget * 0.7) {
                    setHasShown70Warning(false);
                }
            };

            const resetApp = () => {
                setCart([]);
                setBudgetMode(false);
                setBudget(0);
                setBudgetInputStr('');
                setScannedItem(null);
                setItemQty(1);
                setIsKeyboardVisible(true);
                setHasShown70Warning(false);
                setPopupAlert(null);
                setIsQtyPadVisible(false);
                setScreen('splash1');
            };

            // --- KEYBOARD ACTIONS ---
            const handleKeyPress = (key) => {
                if (key === 'DEL') {
                    setManualInputValue(prev => prev.slice(0, -1));
                } else if (key === 'SPACE') {
                    setManualInputValue(prev => prev + ' ');
                } else if (key === 'ENTER') {
                    handleManualSearch();
                } else {
                    setManualInputValue(prev => prev + key);
                }
            };

            // --- SCREEN RENDERS ---

            // Screen 1: Splash 1
            const renderSplash1 = () => (
                <div className="flex flex-col items-center justify-center h-full bg-[#FFF9F5] text-gray-800 animate-pulse">
                    <div className="w-28 h-28 bg-orange-500 rounded-[35px] flex items-center justify-center mb-6 shadow-xl shadow-orange-200">
                        <ScanLine size={56} className="text-white" />
                    </div>
                    <h1 className="text-4xl font-bold tracking-wider text-orange-950">CartPunch</h1>
                    <p className="text-orange-600/80 mt-2 tracking-widest text-sm uppercase font-bold">System</p>
                </div>
            );

            // Screen 2: Tutorial Manual
            const renderTutorial = () => (
                <div className="flex flex-col h-full bg-orange-50 overflow-hidden relative">
                    <div className="absolute top-32 -left-12 text-orange-500/5 rotate-[-15deg] pointer-events-none">
                        <ShoppingCart size={220} />
                    </div>
                    <div className="absolute bottom-40 -right-16 text-orange-500/5 rotate-[15deg] pointer-events-none">
                        <Barcode size={280} />
                    </div>
                    <div className="absolute top-1/4 right-8 text-orange-500/10 font-black text-8xl pointer-events-none">1</div>
                    <div className="absolute top-1/2 left-6 text-orange-500/10 font-black text-9xl pointer-events-none">2</div>
                    <div className="absolute bottom-1/3 right-10 text-orange-500/10 font-black text-8xl pointer-events-none">3</div>

                    <div className="bg-orange-500 pt-10 pb-6 px-8 rounded-b-[2.5rem] shadow-md relative z-10 shrink-0">
                        <div className="flex items-center justify-center space-x-3">
                            <BookOpen className="text-white" size={32} />
                            <h2 className="text-2xl font-bold text-white tracking-wide text-center">How to Use CartPunch</h2>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col justify-center px-6 pt-4 pb-6 z-10 relative">
                        <div className="space-y-3 mb-auto mt-2">
                            {[
                                "Set your limit budget.",
                                "Scan the item barcode to the Barcode Scanner Module.",
                                "If scanning doesn't work, input the item barcode number or the name of the item.",
                                "Add your selected items to the cart. You can easily adjust quantities or remove items as needed.",
                                "Review your final cart summary and complete your checkout. Happy shopping!"
                            ].map((step, i) => (
                                <div key={i} className="flex items-start space-x-4 bg-white/90 backdrop-blur-sm p-3.5 rounded-2xl shadow-sm border border-orange-100">
                                    <div className="bg-orange-100 text-orange-600 font-black w-8 h-8 rounded-full flex items-center justify-center shrink-0 shadow-inner">
                                        {i + 1}
                                    </div>
                                    <p className="text-[13px] font-bold text-gray-700 leading-snug pt-1">
                                        {step}
                                    </p>
                                </div>
                            ))}
                        </div>

                        <div className="mt-4 bg-white/90 backdrop-blur-sm p-4 rounded-2xl border border-blue-100 shadow-sm shrink-0">
                            <p className="text-blue-800 font-bold text-[11px] text-center italic leading-relaxed uppercase tracking-wider">
                                Offline? No problem! Your cart automatically saves your items so your shopping trip stays on track!
                            </p>
                        </div>

                        <button
                            onClick={() => setScreen('budget_prompt')}
                            className="w-full mt-4 py-5 bg-orange-500 text-white rounded-[1.5rem] font-bold text-xl shadow-lg shadow-orange-200 hover:bg-orange-600 transition-colors shrink-0"
                        >
                            Understood
                        </button>
                    </div>
                </div>
            );

            // Screen 3: Budget Prompt
            const renderBudgetPrompt = () => (
                <div className="flex flex-col h-full bg-[#FFF9F5] items-center justify-center px-8 transition-colors">
                    <div className="w-24 h-24 bg-white shadow-sm border border-orange-100 rounded-full flex items-center justify-center mb-8">
                        <ShoppingCart size={48} className="text-orange-500" />
                    </div>
                    <h2 className="text-3xl font-bold text-center mb-3 text-gray-800">Set a Budget?</h2>

                                        >
                                            <Trash2 size={24} />
                                        </button>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    <div className={`bg-white p-8 rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.05)] border-t ${theme.border} z-10 relative transition-colors`}>
                        <div className="flex justify-between items-end mb-6 space-x-4 w-full">
                            <span className="text-gray-500 font-bold text-lg shrink-0">Total ({cart.reduce((s, i) => s + i.qty, 0)} items)</span>
                            <span className="text-4xl font-black text-gray-800 truncate text-right flex-1 min-w-0">₱{formatNumberWithCommas(cartTotal.toFixed(2))}</span>
                        </div>
                        <button
                            onClick={() => cart.length > 0 && setScreen('checkout')}
                            className={`w-full py-5 rounded-2xl font-bold text-xl transition-all shadow-lg ${cart.length > 0 ? `${theme.primary} text-white ${theme.primaryHover} ${theme.shadow}` : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                        >
                            Lock & Finish
                        </button>
                    </div>
                </div>
            );

            // Popups
            const renderWarning70Popup = () => (
                <div className="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-6">
                    <div className="bg-white p-8 rounded-[2.5rem] w-full max-w-sm flex flex-col items-center text-center shadow-2xl border-4 border-yellow-400">
                        <div className="w-20 h-20 bg-yellow-100 rounded-[1.5rem] flex items-center justify-center mb-6 border border-yellow-200 shadow-sm">
                            <AlertCircle size={48} className="text-yellow-600" />
                        </div>
                        <h2 className="text-3xl font-black mb-3 text-gray-800">Budget Warning!</h2>
                        <p className="text-gray-500 text-lg mb-8 leading-relaxed">You have reached <span className="font-bold text-yellow-600">70%</span> of your set budget. Spend wisely!</p>
                        <button
                            onClick={() => setPopupAlert(null)}
                            className="w-full py-5 bg-yellow-500 text-white rounded-2xl font-bold text-xl shadow-lg shadow-yellow-200 hover:bg-yellow-600 active:scale-95 transition-all"
                        >
                            Close
                        </button>
                    </div>
                </div>
            );

            const renderBudgetAlertPopup = () => (
                <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-6">
                    <div className="bg-white p-6 rounded-[2.5rem] w-full max-w-sm flex flex-col items-center text-center shadow-2xl border-4 border-red-500">
                        <div className="w-20 h-20 bg-red-100 rounded-[1.5rem] flex items-center justify-center mb-4 border border-red-200 shadow-sm">
                            <AlertCircle size={48} className="text-red-500" />
                        </div>
                        <h2 className="text-2xl font-black mb-2 text-gray-800">Budget Limit Reached!</h2>
                        <p className="text-gray-500 text-sm mb-6 w-full text-center">Adding this item exceeds your budget of <br /><span className="font-bold text-red-600 truncate block w-full max-w-[250px] mx-auto mt-1">₱{formatNumberWithCommas(budget.toFixed(2))}</span></p>

                        <div className="bg-red-50 border border-red-100 p-4 rounded-2xl w-full mb-6">
                            <div className="flex justify-between mb-2 text-sm font-medium text-gray-600 space-x-4">
                                <span className="shrink-0">Current Total:</span>
                                <span className="font-bold text-gray-800 truncate text-right flex-1">₱{formatNumberWithCommas(cartTotal.toFixed(2))}</span>
                            </div>
                            <div className="flex justify-between mb-2 text-sm font-medium text-gray-600 space-x-4">
                                <span className="shrink-0">Item to Add:</span>
                                <span className="font-bold text-gray-800 truncate text-right flex-1">₱{formatNumberWithCommas((scannedItem?.price * itemQty).toFixed(2))}</span>
                            </div>
                            <div className="h-px bg-red-200 my-2"></div>
                            <div className="flex justify-between text-lg font-black text-red-600 space-x-4">
                                <span className="shrink-0">New Total:</span>
                                <span className="truncate text-right flex-1">₱{formatNumberWithCommas((cartTotal + (scannedItem?.price * itemQty)).toFixed(2))}</span>
                            </div>
                        </div>

                        <div className="space-y-3 w-full">
                            <button
                                onClick={() => {
                                    setPopupAlert(null);
                                    setReturnScreen('item_scanned');
                                    setBudgetInputStr(budget.toString());
                                    setScreen('budget_input');
                                }}
                                className="w-full py-4 bg-orange-100 text-orange-700 border border-orange-200 rounded-2xl font-bold text-base hover:bg-orange-200 transition-colors"
                            >
                                Increase Budget Limit
                            </button>
                            <button
                                onClick={() => {
                                    setPopupAlert(null);
                                    setScreen('cart');
                                }}
                                className="w-full py-4 bg-gray-100 text-gray-700 border border-gray-200 rounded-2xl font-bold text-base hover:bg-gray-200 transition-colors"
                            >
                                Go to Cart to Adjust
                            </button>
                            <button
                                onClick={() => {
                                    addToCartState(scannedItem, itemQty);
                                    setPopupAlert(null);
                                    setScreen('checkout');
                                }}
                                className="w-full py-4 bg-red-500 text-white rounded-2xl font-bold text-base shadow-lg shadow-red-200 hover:bg-red-600 transition-colors"
                            >
                                Add Anyway & Finish Up
                            </button>
                            <button
                                onClick={() => {
                                    setPopupAlert(null);
                                    setScreen(scanOrigin);
                                }}
                                className="w-full py-3 bg-transparent text-gray-500 rounded-2xl font-bold text-sm hover:bg-gray-50 transition-colors"
                            >
                                Cancel Item
                            </button>
                        </div>
                    </div>
                </div>
            );

            const renderQtyPadPopup = () => {
                const numKeys = [
                    ['1', '2', '3'],
                    ['4', '5', '6'],
                    ['7', '8', '9'],
                    ['DEL', '0', 'OK']
                ];

                const handleKey = (key) => {
                    if (key === 'DEL') {
                        setQtyInputStr(prev => prev.length > 1 ? prev.slice(0, -1) : '0');
                    } else if (key === 'OK') {
                        const num = parseInt(qtyInputStr || '0', 10);
                        setItemQty(Math.max(1, num));
                        setIsQtyPadVisible(false);
                    } else {
                        setQtyInputStr(prev => {
                            if (prev === '0') return key;
                            if (prev.length >= 3) return prev;
                            return prev + key;
                        });
                    }
                };

                const adjustStr = (delta) => {
                    const num = parseInt(qtyInputStr || '0', 10);
                    const next = Math.max(1, num + delta);
                    setQtyInputStr(next.toString());
                };

                return (
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-6">
                        <div className={`bg-white p-6 rounded-[2.5rem] w-full max-w-sm flex flex-col shadow-2xl border-4 ${theme.borderHighlight}`}>
                            <h3 className="text-center font-bold text-gray-400 mb-6 uppercase tracking-wider text-sm">Set Quantity</h3>

                            <div className="flex items-center justify-center space-x-6 mb-8">
                                <button onClick={() => adjustStr(-1)} className={`p-4 ${theme.softBg} ${theme.textValue} rounded-2xl active:scale-95 transition-transform`}><ChevronDown size={32} strokeWidth={3} /></button>
                                <div className="text-6xl font-black w-24 text-center text-gray-800">{qtyInputStr || '0'}</div>
                                <button onClick={() => adjustStr(1)} className={`p-4 ${theme.softBg} ${theme.textValue} rounded-2xl active:scale-95 transition-transform`}><ChevronUp size={32} strokeWidth={3} /></button>
                            </div>

                            <div className="flex flex-col space-y-3">
                                {numKeys.map((row, i) => (
                                    <div key={i} className="flex space-x-3">
                                        {row.map(key => (
                                            <button
                                                key={key}
                                                onClick={() => handleKey(key)}
                                                className={`h-16 flex-1 rounded-2xl font-bold text-2xl shadow-[0_2px_0_rgba(0,0,0,0.05)] active:translate-y-1 active:shadow-none transition-all flex items-center justify-center border border-gray-100
                                ${key === 'DEL' ? 'bg-gray-100 text-gray-600' : key === 'OK' ? `${theme.primary} text-white shadow-[0_4px_0_rgba(0,0,0,0.15)]` : 'bg-white text-gray-800 hover:bg-orange-50'}`}
                                            >
                                                {key === 'DEL' ? <Delete size={24} /> : key === 'OK' ? <CheckCircle2 size={28} /> : key}
                                            </button>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            // Screen 12: Checkout
            const renderCheckout = () => (
                <div className={`flex flex-col h-full ${defaultTheme.bg} transition-colors`}>
                    <div className={`${defaultTheme.primary} pt-10 pb-8 px-8 shadow-md z-10 relative text-white rounded-b-[2.5rem] transition-colors shrink-0 flex flex-col`}>
                        <div className="flex items-center mb-8 shrink-0">
                            <button onClick={() => setScreen('cart')} className="p-3 bg-white/20 hover:bg-white/30 rounded-full text-white mr-4 transition-colors">
                                <ArrowLeft size={24} />
                            </button>
                            <h2 className="text-2xl font-bold">Finish Up</h2>
                        </div>
                        <p className="text-white/80 text-sm font-bold uppercase tracking-wider mb-2 shrink-0">Total Bill to Pay</p>
                        <div className="w-full overflow-hidden">
                            <h1 className="text-6xl font-black tracking-tight truncate w-full">₱{formatNumberWithCommas(cartTotal.toFixed(2))}</h1>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-8">
                        <h3 className="font-bold text-gray-700 mb-4 flex items-center text-lg uppercase tracking-wider shrink-0">
                            <ScanLine size={20} className={`mr-3 ${defaultTheme.textValue} transition-colors`} /> Scanned Items
                        </h3>

                        <div className={`bg-white rounded-[2rem] shadow-sm border ${defaultTheme.borderHighlight} overflow-hidden mb-6 transition-colors`}>
                            {cart.map((item, index) => (
                                <div key={index} className="p-5 border-b border-gray-100 flex justify-between items-center last:border-0">
                                    <div className="flex-1 pr-4 min-w-0">
                                        <h4 className="font-bold text-gray-800 text-base mb-1 truncate">{item.name}</h4>
                                        <p className="text-sm font-medium text-gray-500">Qty: {item.qty} | ₱{formatNumberWithCommas(item.price.toFixed(2))}</p>
                                    </div>
                                    <div className={`${defaultTheme.softBg} border ${defaultTheme.borderHighlight} px-3 py-1.5 rounded-lg shadow-sm shrink-0 ml-2 transition-colors min-w-0 max-w-[120px] flex items-center justify-center overflow-hidden`}>
                                        <p className={`font-black ${defaultTheme.textValue} text-lg transition-colors truncate w-full text-center`}>₱{formatNumberWithCommas((item.price * item.qty).toFixed(2))}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className={`bg-white p-8 rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.05)] border-t ${defaultTheme.border} z-10 relative transition-colors`}>
                        <button
                            onClick={() => setScreen('thank_you')}
                            className={`w-full py-6 ${defaultTheme.primary} text-white rounded-[1.5rem] font-bold text-xl shadow-xl ${defaultTheme.shadow} ${defaultTheme.primaryHover} transition-colors flex items-center justify-center space-x-3`}
                        >
                            <CheckCircle2 size={28} />
                            <span>Confirm & Exit</span>
                        </button>
                    </div>
                </div>
            );

            // Screen 16: Thank You
            const renderThankYou = () => (
                <div className={`flex flex-col h-full ${defaultTheme.bg} items-center justify-center px-8 text-center transition-colors`}>
                    <div className={`w-32 h-32 bg-white shadow-xl ${defaultTheme.shadow} border ${defaultTheme.borderHighlight} rounded-full flex items-center justify-center mb-10 transition-colors`}>
                        <CheckCircle2 size={64} className={defaultTheme.textValue} />
                    </div>
                    <h2 className={`text-4xl font-black mb-4 ${defaultTheme.textTitle} transition-colors`}>Thank You!</h2>
                    <p className="text-gray-500 text-lg mb-12 px-4 leading-relaxed">Your shopping session is successfully completed. Have a great day!</p>

                    <div className="w-full flex items-center justify-center space-x-3 text-gray-400 mt-8">
                        <div className="w-2 h-2 rounded-full bg-orange-300 animate-bounce"></div>
                        <p className="text-sm font-bold uppercase tracking-widest">Restarting Shortly</p>
                        <div className="w-2 h-2 rounded-full bg-orange-300 animate-bounce" style={{ animationDelay: '200ms' }}></div>
                    </div>
                </div>
            );

            // --- MAIN RENDER ROUTER ---
            return (
                <div className="min-h-screen bg-neutral-200 py-10 flex items-center justify-center font-sans p-4">
                    <div className="w-full max-w-[530px] h-[769px] bg-white rounded-[2.5rem] shadow-2xl shadow-neutral-400 border-[16px] border-[#1c1c1e] relative overflow-hidden flex flex-col select-none">

                        {/* Network Status Toggle */}
                        {screen !== 'splash1' && screen !== 'tutorial' && (
                            <button
                                onClick={() => setIsOnline(!isOnline)}
                                className={`absolute top-5 right-6 z-50 flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider shadow-sm transition-all border backdrop-blur-md ${isOnline
                                    ? 'bg-white/90 text-green-600 border-green-200 hover:bg-white'
                                    : 'bg-white/90 text-gray-500 border-gray-200 hover:bg-white'
                                    }`}
                            >
                                <div className={`w-2 h-2 rounded-full ${isOnline ? 'bg-green-500 animate-pulse' : 'bg-gray-400'}`}></div>
                                <span>{isOnline ? 'Online' : 'Offline'}</span>
                            </button>
                        )}

                        {screen === 'splash1' && renderSplash1()}
                        {screen === 'tutorial' && renderTutorial()}
                        {screen === 'budget_prompt' && renderBudgetPrompt()}
                        {screen === 'budget_input' && renderBudgetInput()}
                        {screen === 'scanning' && renderScanning()}
                        {screen === 'manual_input' && renderManualInput()}
                        {screen === 'item_scanned' && renderItemScanned()}
                        {screen === 'cart' && renderCart()}
                        {screen === 'checkout' && renderCheckout()}
                        {screen === 'thank_you' && renderThankYou()}

                        {/* --- GLOBAL POPUP OVERLAYS --- */}
                        {popupAlert === 'warning70' && renderWarning70Popup()}
                        {popupAlert === 'limit' && renderBudgetAlertPopup()}
                        {isQtyPadVisible && renderQtyPadPopup()}

                    </div>
                </div>
            );
        }

        // Mount React 18 Application inside Container context
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
