    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Custom Scanner & Floating Animations */
        @keyframes scan {
            0% {
                top: 10%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 90%;
                opacity: 0;
            }
        }

        @keyframes floatUp {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes rowGlowYellow {

            0%,
            100% {
                background-color: rgba(254, 240, 138, 0.92);
            }

            50% {
                background-color: rgba(253, 224, 71, 0.98);
            }

        @keyframes rowGlowRed {

            0%,
            100% {
                background-color: rgba(254, 202, 202, 0.92);
            }

            50% {
                background-color: rgba(252, 165, 165, 0.98);
            }
        }

        .animate-scan-line {
            animation: scan 2s ease-in-out infinite;
        }

        .animate-float-up {
            animation: floatUp 3s ease-in-out infinite;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Format numeric strings with comma separators
        const formatNumberWithCommas = (str) => {
            if (str === undefined || str === null || str === '') return '0';
            const parts = str.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join('.');
        };

        // --- SELF-CONTAINED SVG ICONS ---
        const IconWrapper = ({ size = 24, strokeWidth = 2, className = "", children }) => (

        const ScanLine = (props) => (

        const Type = (props) => (

        const Barcode = (props) => (

        const BookOpen = (props) => (
            <IconWrapper {...props}>
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />

        );

        const X = (props) => (
            <IconWrapper {...props}>
                <path d="M18 6 6 18" />

            </IconWrapper>
        );

        const ShieldCheck = (props) => (
            <IconWrapper {...props}>
                <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
                <path d="m9 12 2 2 4-4" />

        const Search = (props) => (
            <IconWrapper {...props}>
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
            </IconWrapper>
        );

        // Sideways Battery Icon
        const SidewaysBattery = () => (
            <div className="flex items-center" title="Battery Status">
                <div className="w-6 h-3 rounded-[3px] border-[1.5px] border-gray-600 p-[1.5px] flex items-center bg-white">
                    <div className="h-full w-4/5 bg-emerald-500 rounded-[1px]"></div>
                </div>
                <div className="w-[2px] h-1.5 bg-gray-600 rounded-r-[1px] ml-[1px]"></div>
            </div>
        );

        function App() {
            // --- LIVE FIREBASE DATABASE PRODUCTS ---
            const [products, setProducts] = useState([]);

            // --- NAVIGATION & CORE STATE ---
            const [screen, setScreen] = useState('splash1');
            const [budgetMode, setBudgetMode] = useState('none');
            const [budget, setBudget] = useState(0);
            const [budgetInputStr, setBudgetInputStr] = useState('');
            const CATEGORIES = [
                { key: 'snacks', label: 'Snacks', emoji: '🍿', keywords: ['snack', 'chip', 'crisp', 'popcorn', 'pretzel'] },
                { key: 'biscuits', label: 'Biscuits & Cookies', emoji: '🍪', keywords: ['biscuit', 'cookie', 'crackers', 'wafer'] },
                { key: 'meat', label: 'Meat & Poultry', emoji: '🥩', keywords: ['meat', 'beef', 'pork', 'chicken', 'longganisa', 'tocino', 'hotdog', 'sausage'] },
                { key: 'dairy', label: 'Dairy & Eggs', emoji: '🥛', keywords: ['milk', 'cheese', 'butter', 'yogurt', 'egg', 'cream'] },
                { key: 'beverages', label: 'Beverages', emoji: '🥤', keywords: ['juice', 'water', 'soda', 'drink', 'cola', 'coffee', 'tea', 'energy'] },
                { key: 'bread', label: 'Bread & Pastry', emoji: '🍞', keywords: ['bread', 'pandesal', 'loaf', 'bun', 'roll', 'cake', 'muffin', 'donut'] },
                { key: 'noodles', label: 'Noodles & Rice', emoji: '🍜', keywords: ['noodle', 'pasta', 'spaghetti', 'rice', 'miki', 'bihon', 'sotanghon'] },
                { key: 'canned', label: 'Canned Goods', emoji: '🥫', keywords: ['canned', 'corned', 'spam', 'tuna', 'sardines', 'luncheon'] },
                { key: 'condiments', label: 'Condiments & Spices', emoji: '🧂', keywords: ['sauce', 'vinegar', 'soy', 'ketchup', 'sugar', 'salt', 'pepper', 'seasoning', 'oil', 'mayonnaise'] },
                { key: 'personal', label: 'Personal Care', emoji: '🧴', keywords: ['soap', 'shampoo', 'toothpaste', 'lotion', 'deodorant', 'powder', 'cologne', 'tissue'] },
                { key: 'cleaning', label: 'Cleaning Supplies', emoji: '🧹', keywords: ['detergent', 'bleach', 'fabric', 'softener', 'cleaner', 'dishwash'] },
                { key: 'others', label: 'Others', emoji: '🛒', keywords: [] }
            ];
            const mkDefaultCatBudgets = () => CATEGORIES.reduce((budgets, category) => {
                budgets[category.key] = '';
                return budgets;
            }, {});
            const [categoryBudgets, setCategoryBudgets] = useState(mkDefaultCatBudgets);
            const [lastScannedCategory, setLastScannedCategory] = useState(null);
            const detectCategory = (productName) => {
                const name = (productName || '').toLowerCase();
                return CATEGORIES.find(category =>
                    category.keywords.length > 0 && category.keywords.some(keyword => name.includes(keyword))
                ) || CATEGORIES.find(category => category.key === 'others');
            };

            // Cart & Scanning State
            const [cart, setCart] = useState([]);
            const [scannedItem, setScannedItem] = useState(null);
            const [itemQty, setItemQty] = useState(1);
            const [manualInputType, setManualInputType] = useState('barcode'); // 'barcode' | 'name'
            const [manualInputValue, setManualInputValue] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [isKeyboardVisible, setIsKeyboardVisible] = useState(true);
            const [isOnline, setIsOnline] = useState(true);
            useEffect(() => {
                const handleOnline = () => setIsOnline(true);
                const handleOffline = () => setIsOnline(false);
                window.addEventListener("online", handleOnline);
                window.addEventListener("offline", handleOffline);

                let unsubscribeFirebase = null;
                if (typeof firebase !== "undefined" && firebase.database) {
                    const connectedRef = firebase.database().ref(".info/connected");
                    const listener = connectedRef.on("value", (snap) => {
                        setIsOnline(snap.val() === true);
                    });
                    unsubscribeFirebase = () => connectedRef.off("value", listener);
                }

                return () => {
                    window.removeEventListener("online", handleOnline);
                    window.removeEventListener("offline", handleOffline);
                    if (unsubscribeFirebase) unsubscribeFirebase();
                };
            }, []);
            const [scanNotice, setScanNotice] = useState('');

            // Popups & Alerts
            const [hasShown70Warning, setHasShown70Warning] = useState(false);
            const [popupAlert, setPopupAlert] = useState(null); // null | 'warning70' | 'limit'
            const [alertMessage, setAlertMessage] = useState('');
            const [returnScreen, setReturnScreen] = useState(null);
            const [scanOrigin, setScanOrigin] = useState('scanning');

            // Quantity Keypad Overlay State
            const [isQtyPadVisible, setIsQtyPadVisible] = useState(false);
            const [qtyInputStr, setQtyInputStr] = useState('1');
            const [editingCartItemId, setEditingCartItemId] = useState(null);

            // Thank You 10-second countdown
            const [thankYouSeconds, setThankYouSeconds] = useState(10);
            const [checkoutAction, setCheckoutAction] = useState(null);
            const [qrError, setQrError] = useState('');
            const qrContainerRef = useRef(null);

            // Barcode hardware scanner buffer
            const scanBufferRef = useRef('');
            const scanTimerRef = useRef(null);

            // --- SYNC LIVE PRODUCTS FROM FIREBASE REALTIME DATABASE ---
            useEffect(() => {
                const productsRef = db.ref('products');
                productsRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    const loaded = [];
                    if (data) {
                        Object.keys(data).forEach(key => {
                            const raw = data[key];
                            const itemName = raw.name || raw.item_description || raw.description || 'Unknown Item';
                            const itemPrice = parseFloat(raw.price !== undefined ? raw.price : raw.unit_price) || 0;
                            loaded.push({
                                id: String(raw.sku || key),
                                name: itemName,
                                price: itemPrice
                            });
                        });
                    }
                    setProducts(loaded);
                    setIsOnline(true);
                }, (error) => {
                    console.error("Firebase connection error:", error);
                    setIsOnline(false);
                });

                return () => productsRef.off();
            }, []);

            // --- DERIVED CALCULATIONS ---
            const categoryBudgetTotal = CATEGORIES.reduce(
                (sum, category) => sum + (parseFloat(categoryBudgets[category.key]) || 0),
                0
            );
            const effectiveBudget = budgetMode === 'single'
                ? budget
                : budgetMode === 'category' ? categoryBudgetTotal : 0;
            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const getCategorySpent = (categoryKey) => cart
                .filter(item => detectCategory(item.name).key === categoryKey)
                .reduce((sum, item) => sum + (item.price * item.qty), 0);


            // --- AUTOMATIC BARCODE SCANNER LISTENER ON HOME SCREEN ---
            useEffect(() => {
                if (screen !== 'scanning' || popupAlert || isQtyPadVisible) return;

                const handleKeyDown = (e) => {
                    if (e.key === 'Enter') {
                        const code = scanBufferRef.current.trim();
                        scanBufferRef.current = '';
                        if (code.length >= 4) {
                            const found = products.find(i => i.id === code);
                            if (found) {
                                triggerItemScanned(found, 'scanning');
                            } else {
                                setScanNotice(`Barcode "${code}" not found in system.`);
                            }
                        }
                        return;
                    }
                    if (e.key.length === 1) {
                        scanBufferRef.current += e.key;
                        clearTimeout(scanTimerRef.current);
                        scanTimerRef.current = setTimeout(() => {
                            scanBufferRef.current = '';
                        }, 300);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [screen, popupAlert, isQtyPadVisible, products]);

            // Auto-clear scanner notice after 3 seconds
            useEffect(() => {
                if (!scanNotice) return;
                const timer = setTimeout(() => setScanNotice(''), 3000);
                return () => clearTimeout(timer);
            }, [scanNotice]);

            // --- THANK YOU 10-SECOND COUNTDOWN & AUTO-RESET ---
            useEffect(() => {
                if (screen !== 'thank_you') return;
                setThankYouSeconds(10);

                const interval = setInterval(() => {
                    setThankYouSeconds(prev => {
                        if (prev <= 1) {
                            clearInterval(interval);
                            resetApp();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(interval);
            }, [screen]);

            useEffect(() => {
                if (checkoutAction !== 'qr') return;

                const container = qrContainerRef.current;
                const qrLibrary = window.qrcode;
                if (!container || !qrLibrary) {
                    setQrError('QR code generation is unavailable. Check the internet connection and try again.');
                    return;
                }

                container.innerHTML = '';
                try {
                    const totalUnits = cart.reduce((total, item) => total + item.qty, 0);
                    const itemLines = cart.map(item =>
                        `${item.name.replace(/\s+/g, ' ').trim()}\t₱${item.price.toFixed(2)}\t${item.qty}\t₱${(item.price * item.qty).toFixed(2)}`
                    ).join('\n\n');
                    const receiptLines = [
                        `totaling ₱${cartTotal.toFixed(2)} across ${totalUnits} total units:`,
                        '',
                        'Item Description\tUnit Price\tQty\tSubtotal',
                        itemLines,
                        '',
                        `Total\t\t${totalUnits}\t₱${cartTotal.toFixed(2)}`
                    ];

                    qrLibrary.stringToBytes = qrLibrary.stringToBytesFuncs['UTF-8'];
                    const qrCode = qrLibrary(0, 'L');
                    qrCode.addData(receiptLines.join('\n'), 'Byte');
                    qrCode.make();

                    const cellSize = Math.max(1, Math.round(240 / (qrCode.getModuleCount() + 8)));
                    const qrImage = document.createElement('img');
                    qrImage.alt = 'QR code containing the plain-text CartPunch receipt';
                    qrImage.className = 'block max-w-full h-auto';
                    qrImage.src = qrCode.createDataURL(cellSize, 4);
                    container.replaceChildren(qrImage);
                    setQrError('');
                } catch (error) {
                    console.error('Receipt QR generation failed:', error);
                    setQrError('This receipt is too large to encode. You can proceed and exit without a QR code.');
                }

                return () => {
                    container.innerHTML = '';
                };
            }, [checkoutAction, cart, cartTotal]);

            // --- MANUAL SEARCH FILTER ---
            useEffect(() => {
                if (!manualInputValue.trim()) {
                    setSearchResults([]);
                    return;
                }
                const lower = manualInputValue.toLowerCase();
                const filtered = products.filter(item =>
                    manualInputType === 'barcode'
                        ? item.id.includes(lower)
                        : item.name.toLowerCase().includes(lower)
                );
                setSearchResults(filtered);
            }, [manualInputValue, manualInputType, products]);

            // --- THEME ENGINE ---
            const defaultTheme = {
                bg: 'bg-[#FFF9F5]',
                primary: 'bg-orange-500',
                primaryHover: 'hover:bg-orange-600',
                textTitle: 'text-orange-950',
                textValue: 'text-orange-600',
                iconBg: 'bg-orange-100',
                iconColor: 'text-orange-600',
                border: 'border-orange-100',
                borderHighlight: 'border-orange-200',
                shadow: 'shadow-orange-200',
                softBg: 'bg-orange-50',
                laserBg: 'bg-orange-500',
                laserShadow: 'shadow-[0_0_20px_#f97316]',
                hoverBorder: 'hover:border-orange-500',
                hoverText: 'group-hover:text-orange-500'
            };

            const getThemeColors = () => {
                const pct = (budgetMode !== 'none' && effectiveBudget > 0) ? (cartTotal / effectiveBudget) : 0;
                if (pct >= 0.9) {
                    return {
                        bg: 'bg-red-50',
                        primary: 'bg-red-500',
                        primaryHover: 'hover:bg-red-600',
                        textTitle: 'text-red-950',
                        textValue: 'text-red-600',
                        iconBg: 'bg-red-100',
                        iconColor: 'text-red-600',
                        border: 'border-red-100',
                        borderHighlight: 'border-red-200',
                        shadow: 'shadow-red-200',
                        softBg: 'bg-red-50',
                        laserBg: 'bg-red-500',
                        laserShadow: 'shadow-[0_0_20px_#ef4444]',
                        hoverBorder: 'hover:border-red-500',
                        hoverText: 'group-hover:text-red-500'
                    };
                }
                if (pct >= 0.7) {
                    return {
                        bg: 'bg-yellow-50',
                        primary: 'bg-yellow-500',
                        primaryHover: 'hover:bg-yellow-600',
                        textTitle: 'text-yellow-900',
                        textValue: 'text-yellow-700',
                        iconBg: 'bg-yellow-100',
                        iconColor: 'text-yellow-700',
                        border: 'border-yellow-200',
                        borderHighlight: 'border-yellow-300',
                        shadow: 'shadow-yellow-200',
                        softBg: 'bg-yellow-50',
                        laserBg: 'bg-yellow-400',
                        laserShadow: 'shadow-[0_0_20px_#facc15]',
                        hoverBorder: 'hover:border-yellow-500',
                        hoverText: 'group-hover:text-yellow-600'
                    };
                }
                return defaultTheme;
            };

            const theme = getThemeColors();

            // --- CORE ACTIONS ---
            const resetApp = () => {
                setCart([]);
                setBudgetMode('none');
                setBudget(0);
                setBudgetInputStr('');
                setCategoryBudgets(mkDefaultCatBudgets());
                setLastScannedCategory(null);
                setScannedItem(null);
                setItemQty(1);
                setManualInputValue('');
                setIsKeyboardVisible(true);
                setScanNotice('');
                setHasShown70Warning(false);
                setPopupAlert(null);
                setAlertMessage('');
                setReturnScreen(null);
                setIsQtyPadVisible(false);
                setEditingCartItemId(null);
                setCheckoutAction(null);
                setQrError('');
                setScreen('splash1');
            };

            const triggerItemScanned = (item, origin = 'scanning') => {
                if (!item) return;
                setScannedItem(item);
                setItemQty(1);
                setScanOrigin(origin);
                setScreen('item_scanned');
            };

            const handleAutomaticDemoScan = () => {
                if (products.length === 0) {
                    setScanNotice('No items loaded from database yet.');
                    return;
                }
                const randomItem = products[Math.floor(Math.random() * products.length)];

            const renderBudgetAlertPopup = () => (
                <div className="absolute inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-5 animate-in fade-in duration-200">
                    <div className="bg-white p-5 rounded-[2rem] w-full max-w-xs flex flex-col items-center text-center shadow-2xl border-4 border-red-500">
                        <div className="w-14 h-14 bg-red-100 rounded-2xl flex items-center justify-center mb-3 border border-red-200">
                            <AlertCircle size={32} className="text-red-500" />
                        </div>
                        <h2 className="text-xl font-black mb-1 text-gray-800">Budget Limit Reached!</h2>
                        <p className="text-gray-500 text-xs mb-4">
                            Adding this item exceeds your total budget of{' '}
                            <span className="font-bold text-red-600">
                                ₱{formatNumberWithCommas(effectiveBudget.toFixed(2))}
                            </span>
                        </p>

                        <div className="bg-red-50 border border-red-100 p-3 rounded-2xl w-full mb-4 text-xs">
                            <div className="flex justify-between mb-1 text-gray-600">
                                <span>Current Total:</span>
                                <span className="font-bold text-gray-800">₱{formatNumberWithCommas(cartTotal.toFixed(2))}</span>
                            </div>
                            <div className="flex justify-between mb-1 text-gray-600">
                                <span>Item to Add:</span>
                                <span className="font-bold text-gray-800">₱{formatNumberWithCommas(((scannedItem?.price || 0) * itemQty).toFixed(2))}</span>
                            </div>
                            <div className="h-px bg-red-200 my-1.5"></div>
                            <div className="flex justify-between text-sm font-black text-red-600">
                                <span>New Total:</span>
                                <span>₱{formatNumberWithCommas((cartTotal + ((scannedItem?.price || 0) * itemQty)).toFixed(2))}</span>
                            </div>
                        </div>

                        <div className="space-y-2 w-full">
                            {budgetMode === 'single' && (
                                <button
                                    onClick={() => {
                                        setPopupAlert(null);
                                        setReturnScreen('item_scanned');
                                        setScreen('budget_input');
                                    }}
                                    className="w-full py-3 bg-white text-red-600 border border-red-200 rounded-xl font-bold text-xs hover:bg-red-50"
                                >
                                    Edit Budget Amount
                                </button>
                            )}
                            {budgetMode === 'category' && (
                                <button
                                    onClick={() => {
                                        setPopupAlert(null);
                                        setReturnScreen('item_scanned');
                                        setScreen('budget_allocate');
                                    }}
                                    className="w-full py-3 bg-white text-red-600 border border-red-200 rounded-xl font-bold text-xs hover:bg-red-50"
                                >
                                    Edit Category Budgets
                                </button>
                            )}
                            <button
                                onClick={() => {
                                    setPopupAlert(null);
                                    setScreen('cart');
                                }}
                                className="w-full py-3 bg-gray-100 text-gray-700 border border-gray-200 rounded-xl font-bold text-xs hover:bg-gray-200"
                            >
                                Go to Cart to Adjust
                            </button>
                            <button
                                onClick={() => {
                                    addToCartState(scannedItem, itemQty);
                                    setPopupAlert(null);
                                    setScreen('checkout');
                                }}
                                className="w-full py-3 bg-red-500 text-white rounded-xl font-bold text-xs shadow-md hover:bg-red-600"
                            >
                                Add Anyway & Finish Up
                            </button>
                            <button
                                onClick={() => {
                                    setPopupAlert(null);
                                    setScreen(scanOrigin);
                                }}
                                className="w-full py-2 text-gray-500 font-bold text-xs hover:bg-gray-50 rounded-xl"
                            >
                                Cancel Item
                            </button>
                        </div>
                    </div>
                </div>
            );

            const renderQtyPadPopup = () => {
                const numKeys = [
                    ['1', '2', '3'],
                    ['4', '5', '6'],
                    ['7', '8', '9'],
                    ['DEL', '0', 'OK']
                ];

                const handleKey = (key) => {
                    if (key === 'DEL') {
                        setQtyInputStr(prev => (prev.length > 1 ? prev.slice(0, -1) : '0'));
                    } else if (key === 'OK') {
                        const num = Math.max(1, parseInt(qtyInputStr || '1', 10));
                        if (editingCartItemId) {
                            setCart(prev => prev.map(item => item.id === editingCartItemId ? { ...item, qty: num } : item));
                            setEditingCartItemId(null);
                        } else {
                            setItemQty(num);
                        }
                        setIsQtyPadVisible(false);
                    } else {
                        setQtyInputStr(prev => {
                            if (prev === '0') return key;
                            if (prev.length >= 3) return prev;
                            return prev + key;
                        });
                    }
                };

                const adjustStr = (delta) => {
                    const num = parseInt(qtyInputStr || '1', 10);
                    setQtyInputStr(Math.max(1, num + delta).toString());
                };

                return (
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-5 animate-in fade-in duration-200">
                        <div className={`bg-white p-5 rounded-[2rem] w-full max-w-xs flex flex-col shadow-2xl border-4 ${theme.borderHighlight}`}>
                            <h3 className="text-center font-bold text-gray-400 mb-4 uppercase tracking-wider text-xs">
                                Set Quantity
                            </h3>

                            <div className="flex items-center justify-center space-x-5 mb-5">
                                <button
                                    onClick={() => adjustStr(-1)}
                                    className={`p-3 ${theme.softBg} ${theme.textValue} rounded-xl active:scale-95`}
                                >
                                    <ChevronDown size={24} strokeWidth={3} />
                                </button>
                                <div className="text-4xl font-black w-20 text-center text-gray-800">{qtyInputStr || '1'}</div>
                                <button
                                    onClick={() => adjustStr(1)}
                                    className={`p-3 ${theme.softBg} ${theme.textValue} rounded-xl active:scale-95`}
                                >
                                    <ChevronUp size={24} strokeWidth={3} />
                                </button>
                            </div>

                            <div className="flex flex-col space-y-2">
                                {numKeys.map((row, i) => (
                                    <div key={i} className="flex space-x-2">
                                        {row.map(key => (
                                            <button
                                                key={key}
                                                onClick={() => handleKey(key)}
                                                className={`h-12 flex-1 rounded-xl font-bold text-lg border border-gray-100 active:scale-95 transition-all flex items-center justify-center ${key === 'DEL'
                                                    ? 'bg-gray-100 text-gray-600'
                                                    : key === 'OK'
                                                        ? `${theme.primary} text-white`
                                                        : 'bg-white text-gray-800 hover:bg-orange-50'
                                                    }`}
                                            >
                                                {key === 'DEL' ? <Delete size={20} /> : key === 'OK' ? <CheckCircle2 size={22} /> : key}
                                            </button>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            // =========================================================================
            // MAIN KIOSK / MONITOR SHELL RENDERER
            // =========================================================================
            return (
                <div className="min-h-screen bg-neutral-200 py-4 sm:py-8 flex items-center justify-center font-sans px-3">
                    <div className="w-full max-w-[480px] h-[760px] max-h-[94vh] bg-white rounded-[2.5rem] shadow-2xl shadow-neutral-400 border-[14px] border-[#1c1c1e] relative overflow-hidden flex flex-col">

                        {/* Persistent Header on all screens except startup & ending */}
                        {showPersistentHeader && <TopHeader />}

                        {/* Screen Router */}
                        {screen === 'splash1' && renderSplash1()}
                        {screen === 'privacy_consent' && renderPrivacyConsent()}
                        {screen === 'tutorial' && renderTutorial()}
                        {screen === 'budget_prompt' && renderBudgetPrompt()}
                        {screen === 'budget_allocate' && renderBudgetAllocate()}
                        {screen === 'budget_input' && renderBudgetInput()}
                        {screen === 'scanning' && renderScanning()}
                        {screen === 'manual_input' && renderManualInput()}
                        {screen === 'item_scanned' && renderItemScanned()}
                        {screen === 'cart' && renderCart()}
                        {screen === 'checkout' && renderCheckout()}
                        {screen === 'thank_you' && renderThankYou()}

                        {/* Global Overlay Modals */}
                        {popupAlert === 'warning70' && renderWarning70Popup()}
                        {popupAlert === 'limit' && renderBudgetAlertPopup()}
                        {isQtyPadVisible && renderQtyPadPopup()}
                        {checkoutAction === 'choice' && renderQrChoicePopup()}
                        {checkoutAction === 'qr' && renderReceiptQrPopup()}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
