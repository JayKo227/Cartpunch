<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartPunch Admin Approval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#ef6c00', 600: '#e65100' },
                        surface: '#f8fafc'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-surface h-screen flex items-center justify-center p-4 text-slate-800">

    <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-xl border border-slate-100 text-center space-y-4">
        <div id="icon-wrap"
            class="w-16 h-16 mx-auto bg-brand-50 text-brand-500 rounded-2xl flex items-center justify-center">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin"></i>
        </div>
        <h1 id="title" class="text-xl font-extrabold text-slate-800">Checking Request...</h1>
        <p id="message" class="text-sm text-slate-500">Checking Main Admin access and request status.</p>
        <div id="request-details" class="hidden rounded-lg bg-slate-50 p-4 text-left text-sm text-slate-600 space-y-1">
            <p><strong>Name:</strong> <span id="request-name"></span></p>
            <p><strong>Email:</strong> <span id="request-email"></span></p>
            <p><strong>Position:</strong> <span id="request-position"></span></p>
            <p><strong>Department:</strong> <span id="request-department"></span></p>
        </div>
        <form id="login-link" class="hidden space-y-3 text-left">
            <div>
                <label for="main-admin-email" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Main Admin Email</label>
                <input id="main-admin-email" type="email" readonly
                    class="w-full px-4 py-2.5 bg-slate-100 border border-slate-200 rounded-lg text-sm text-slate-600">
            </div>
            <div>
                <label for="main-admin-password" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Password</label>
                <input id="main-admin-password" type="password" required autocomplete="current-password"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500">
            </div>
            <button id="password-signin" type="submit"
                class="w-full py-3 bg-brand-500 hover:bg-brand-600 disabled:opacity-60 text-white font-bold rounded-lg shadow-md transition-all">
                Sign in and Continue
            </button>
        </form>
        <button id="google-signin" type="button"
            class="hidden w-full py-3 bg-white hover:bg-slate-50 text-slate-600 font-bold rounded-lg border border-slate-200 transition-all">
            Sign in with Google instead
        </button>
    </div>

    <script>
        lucide.createIcons();

        const firebaseConfig = {
            apiKey: "AIzaSyAnpeLs7fpfkWIxdlqttvd9N_kQM1fss0E",
            authDomain: "cartpunch-a2267.firebaseapp.com",
            databaseURL: "https://cartpunch-a2267-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cartpunch-a2267",
            storageBucket: "cartpunch-a2267.firebasestorage.app",
            messagingSenderId: "413542821283",
            appId: "1:413542821283:web:3bb97cdb6f8b54e774fe16"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const MAIN_ADMIN_EMAIL = "cartpunch.security@gmail.com";
        const params = new URLSearchParams(window.location.search);
        const reqId = params.get('req');
        const action = params.get('action');
        let requestRef = null;
        let requestData = null;
        let approvalStarted = false;
        // Once the decision is saved, later sign-in changes (e.g. another tab signing out)
        // must not replace the result on screen.
        let decisionSaved = false;
        let signInNotice = null;

        function isMainAdminUser(user) {
            return Boolean(user && user.email && user.email.toLowerCase() === MAIN_ADMIN_EMAIL.toLowerCase());
        }

        function renderResult(type, titleText, msgText) {
            const iconWrap = document.getElementById('icon-wrap');
            if (type === 'success') {
                iconWrap.className = 'w-16 h-16 mx-auto bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center';
                iconWrap.innerHTML = '<i data-lucide="check-circle" class="w-8 h-8"></i>';
            } else {
                iconWrap.className = 'w-16 h-16 mx-auto bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center';
                iconWrap.innerHTML = '<i data-lucide="x-circle" class="w-8 h-8"></i>';
            }
            document.getElementById('title').innerText = titleText;
            document.getElementById('message').innerText = msgText;
            lucide.createIcons();
        }

        function showLoginLink() {
            document.getElementById('login-link').classList.remove('hidden');
        }

        async function signInWithGoogle() {
            const button = document.getElementById('google-signin');
            button.disabled = true;
            button.textContent = 'Signing in...';
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({
                login_hint: MAIN_ADMIN_EMAIL,
                prompt: 'select_account'
            });
            try {
                const result = await auth.signInWithPopup(provider);
                if (!isMainAdminUser(result.user)) {
                    signInNotice = {
                        title: 'Wrong Google Account',
                        message: `Sign in with ${MAIN_ADMIN_EMAIL} to approve requests.`
                    };
                    await auth.signOut();
                    renderResult('error', signInNotice.title, signInNotice.message);
                    showLoginLink();
                }
            } catch (error) {
                console.error(error);
                let message;
                if (error.code === 'auth/operation-not-allowed') {
                    message = 'Google sign-in is not enabled for this Firebase project. Enable it under Firebase Authentication sign-in providers.';
                } else if (error.code === 'auth/popup-blocked') {
                    message = 'The sign-in popup was blocked. Allow popups for localhost and try again.';
                } else {
                    message = 'Could not sign in with Google: ' + (error.message || 'Unknown error');
                }
                renderResult('error', 'Google Sign-In Failed', message);
                showLoginLink();
            } finally {
                button.disabled = false;
                button.textContent = 'Sign in with Google as Main Admin';
            }
        }

        async function signInWithPassword(event) {
            event.preventDefault();
            const button = document.getElementById('password-signin');
            button.disabled = true;
            button.textContent = 'Signing in...';
            try {
                await auth.signInWithEmailAndPassword(MAIN_ADMIN_EMAIL, document.getElementById('main-admin-password').value);
            } catch (error) {
                console.error(error);
                const message = ['auth/wrong-password', 'auth/invalid-credential', 'auth/invalid-login-credentials'].includes(error.code)
                    ? 'Incorrect password for the Main Admin account.'
                    : 'Could not sign in: ' + (error.message || 'Unknown error');
                renderResult('error', 'Sign-In Failed', message);
                showLoginLink();
            } finally {
                button.disabled = false;
                button.textContent = 'Sign in and Continue';
            }
        }

        async function markRequestExpired() {
            const now = Date.now();
            const updates = {};
            updates[`pending_admin_requests/${reqId}/status`] = 'expired';
            updates[`pending_admin_requests/${reqId}/resolvedAt`] = now;
            updates[`pending_admin_requests/${reqId}/password`] = null;
            updates[`pending_admin_status/${reqId}/status`] = 'expired';
            updates[`pending_admin_status/${reqId}/resolvedAt`] = now;
            await db.ref().update(updates);
        }

        async function confirmAction() {
            try {
                const user = auth.currentUser;
                if (!isMainAdminUser(user)) {
                    renderResult('error', 'Main Admin Sign-In Required', `Sign in with ${MAIN_ADMIN_EMAIL} to approve requests.`);
                    showLoginLink();
                    return;
                }

                const latestSnapshot = await requestRef.once('value');
                requestData = latestSnapshot.val();
                if (!requestData) {
                    return renderResult('error', 'Request Not Found', 'This sign-up request does not exist.');
                }
                if (requestData.status !== 'pending') {
                    return renderResult('error', 'Already Processed', `This request was already marked as "${requestData.status}".`);
                }
                if (!Number.isFinite(requestData.expiresAt)) {
                    return renderResult('error', 'Invalid Request', 'This request has no valid expiration time.');
                }
                if (Date.now() >= requestData.expiresAt) {
                    await markRequestExpired();
                    return renderResult('error', 'Link Expired', 'This approval request expired after 5 minutes.');
                }

                const status = action === 'approve' ? 'approved' : 'rejected';
                const now = Date.now();
                const updates = {};
                updates[`pending_admin_requests/${reqId}/status`] = status;
                updates[`pending_admin_requests/${reqId}/${action === 'approve' ? 'approvedAt' : 'resolvedAt'}`] = now;
                updates[`pending_admin_requests/${reqId}/resolvedBy`] = MAIN_ADMIN_EMAIL;
                updates[`pending_admin_requests/${reqId}/password`] = null;
                updates[`pending_admin_status/${reqId}/status`] = status;
                updates[`pending_admin_status/${reqId}/resolvedAt`] = now;
                if (status === 'approved' && typeof requestData.uid === 'string' &&
                    /^[A-Za-z0-9_-]{1,128}$/.test(requestData.uid)) {
                    const adminRef = db.ref(`admins/${requestData.uid}`);
                    const adminSnapshot = await adminRef.once('value');
                    if (!adminSnapshot.exists()) {
                        updates[`admins/${requestData.uid}`] = {
                            requestId: reqId,
                            name: requestData.name,
                            position: requestData.position,
                            department: requestData.department,
                            email: requestData.email,
                            role: 'admin',
                            approvedBy: MAIN_ADMIN_EMAIL,
                            approvedAt: now
                        };
                    }
                }
                await db.ref().update(updates);
                decisionSaved = true;
                renderResult(
                    status === 'approved' ? 'success' : 'error',
                    status === 'approved' ? 'User Has Been Approved!' : 'Request Declined',
                    `${requestData.name} (${requestData.email}) was ${status} by ${MAIN_ADMIN_EMAIL}.`
                );
            } catch (err) {
                console.error(err);
                renderResult('error', 'Approval Failed', 'Could not update this request: ' + err.message);
            }
        }

        async function loadRequest(user) {
            if (decisionSaved) return;
            if (!isMainAdminUser(user)) {
                const notice = signInNotice;
                signInNotice = null;
                renderResult(
                    'error',
                    notice ? notice.title : 'Main Admin Sign-In Required',
                    notice ? notice.message : `Sign in with ${MAIN_ADMIN_EMAIL} to approve requests.`
                );
                showLoginLink();
                return;
            }
            if (approvalStarted) return;
            approvalStarted = true;

            document.getElementById('login-link').classList.add('hidden');
            document.getElementById('google-signin').classList.add('hidden');
            try {
                requestRef = db.ref(`pending_admin_requests/${reqId}`);
                const snap = await requestRef.once('value');
                requestData = snap.val();
                if (!requestData) {
                    return renderResult('error', 'Request Not Found', 'This sign-up request does not exist.');
                }
                if (requestData.status !== 'pending') {
                    return renderResult('error', 'Already Processed', `This request was already marked as "${requestData.status}".`);
                }
                if (!Number.isFinite(requestData.expiresAt)) {
                    return renderResult('error', 'Invalid Request', 'This request has no valid expiration time.');
                }
                if (Date.now() >= requestData.expiresAt) {
                    await markRequestExpired();
                    return renderResult('error', 'Link Expired', 'This approval request expired after 5 minutes.');
                }

                document.getElementById('request-name').textContent = requestData.name;
                document.getElementById('request-email').textContent = requestData.email;
                document.getElementById('request-position').textContent = requestData.position;
                document.getElementById('request-department').textContent = requestData.department;
                document.getElementById('request-details').classList.remove('hidden');
                document.getElementById('title').textContent = action === 'approve' ? 'Approving Admin Request...' : 'Rejecting Admin Request...';
                document.getElementById('message').textContent = 'Main Admin verified. Updating the request in Firebase.';
                await confirmAction();
            } catch (err) {
                console.error(err);
                renderResult('error', 'Approval Failed', 'Could not read request details: ' + err.message);
            }
        }

        // One-click approval: the link in the Main Admin's email carries the secret approval key
        // (written into the EmailJS template, never sent from the applicant's browser). The
        // database rules accept the decision only when the key matches and the request is
        // still pending and inside its 5-minute window, so no sign-in is needed.
        async function approveWithKey(approvalKey) {
            document.getElementById('title').textContent = action === 'approve' ? 'Approving Request...' : 'Rejecting Request...';
            document.getElementById('message').textContent = 'Applying the Main Admin decision from the email link.';
            try {
                const statusSnapshot = await db.ref(`pending_admin_status/${reqId}`).once('value');
                const current = statusSnapshot.val();
                if (!current) {
                    return renderResult('error', 'Request Not Found', 'This sign-up request does not exist.');
                }
                if (current.status !== 'pending') {
                    return renderResult(current.status === 'approved' ? 'success' : 'error', 'Already Processed',
                        `This request was already marked as "${current.status}".`);
                }
                if (!Number.isFinite(current.expiresAt) || Date.now() >= current.expiresAt) {
                    return renderResult('error', 'Link Expired', 'This approval request expired after 5 minutes. The applicant needs to sign up again.');
                }

                const status = action === 'approve' ? 'approved' : 'rejected';
                const now = firebase.database.ServerValue.TIMESTAMP;
                const updates = {};
                updates[`approval_actions/${reqId}`] = { key: approvalKey, action, at: now };
                updates[`pending_admin_requests/${reqId}/status`] = status;
                updates[`pending_admin_requests/${reqId}/${status === 'approved' ? 'approvedAt' : 'resolvedAt'}`] = now;
                updates[`pending_admin_requests/${reqId}/resolvedBy`] = 'Main Admin (email link)';
                updates[`pending_admin_status/${reqId}/status`] = status;
                updates[`pending_admin_status/${reqId}/resolvedAt`] = now;
                await db.ref().update(updates);
                decisionSaved = true;
                renderResult(
                    status === 'approved' ? 'success' : 'error',
                    status === 'approved' ? 'User Has Been Approved!' : 'Request Declined',
                    status === 'approved'
                        ? `${applicantLabel} can now sign in to the CartPunch admin dashboard.`
                        : `${applicantLabel} was declined and cannot sign in.`
                );
            } catch (error) {
                console.error(error);
                renderResult('error', 'Approval Failed',
                    'This link could not be applied. It may have expired, already been used, or the approval key in the email template does not match. ' +
                    (error.message || ''));
            }
        }

        const approvalKey = params.get('key');
        const applicantEmailParam = params.get('email');
        const applicantLabel = applicantEmailParam && applicantEmailParam.includes('@') ? applicantEmailParam : 'The applicant';
        if (!reqId || !/^[A-Za-z0-9_-]+$/.test(reqId) || !['approve', 'reject'].includes(action)) {
            renderResult('error', 'Invalid Approval Link', 'Missing or malformed request parameters.');
        } else if (approvalKey) {
            approveWithKey(approvalKey);
        } else {
            document.getElementById('google-signin').addEventListener('click', signInWithGoogle);
            document.getElementById('main-admin-email').value = MAIN_ADMIN_EMAIL;
            document.getElementById('login-link').addEventListener('submit', signInWithPassword);
            auth.onAuthStateChanged(loadRequest);
        }
    </script>
</body>

</html>
