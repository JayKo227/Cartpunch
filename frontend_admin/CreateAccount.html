<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create CartPunch Admin Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 text-slate-800">
    <main class="w-full max-w-md p-8 bg-white rounded-2xl shadow-xl border border-slate-100 space-y-5">
        <div class="text-center">
            <div class="w-14 h-14 mx-auto bg-orange-600 rounded-2xl flex items-center justify-center text-white mb-3">
                <i data-lucide="user-plus" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-extrabold">Activate Admin Account</h1>
            <p class="text-sm text-slate-500 mt-1">Your password was set during sign-up. Sign in here after approval to activate admin access.</p>
        </div>

        <div id="message" class="hidden rounded-lg p-3 text-sm" role="status"></div>
        <form id="account-form" class="space-y-4">
            <label class="block text-sm font-semibold">
                Email
                <input id="email" type="email" required autocomplete="email"
                    class="mt-1 w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg">
            </label>
            <label class="block text-sm font-semibold">
                Password
                <input id="password" type="password" required minlength="8" autocomplete="current-password"
                    class="mt-1 w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg">
            </label>
            <button id="submit-button" type="submit"
                class="w-full py-3 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-lg">
                Continue
            </button>
        </form>
        <a id="login-link" class="hidden block text-center text-sm font-bold text-orange-700 underline" href="Login.html">
            Continue to Admin Login
        </a>
    </main>

    <script>
        lucide.createIcons();
        const firebaseConfig = {
            apiKey: "AIzaSyAnpeLs7fpfkWIxdlqttvd9N_kQM1fss0E",
            authDomain: "cartpunch-a2267.firebaseapp.com",
            databaseURL: "https://cartpunch-a2267-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cartpunch-a2267",
            storageBucket: "cartpunch-a2267.firebasestorage.app",
            messagingSenderId: "413542821283",
            appId: "1:413542821283:web:3bb97cdb6f8b54e774fe16"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const params = new URLSearchParams(window.location.search);
        const reqId = params.get('req');
        const message = document.getElementById('message');
        const submitButton = document.getElementById('submit-button');
        let provisioning = false;

        function showMessage(text, isError) {
            message.textContent = text;
            message.className = `rounded-lg p-3 text-sm ${isError ? 'bg-rose-50 text-rose-700' : 'bg-emerald-50 text-emerald-700'}`;
            message.classList.remove('hidden');
        }

        function passwordIsStrong(password) {
            return password.length >= 8 && /[A-Za-z]/.test(password) &&
                /[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password);
        }

        async function provisionVerifiedAccount(user) {
            if (provisioning || !user || !user.email || !reqId) return;
            provisioning = true;
            try {
                const statusSnapshot = await db.ref(`pending_admin_status/${reqId}`).once('value');
                const status = statusSnapshot.val();
                if (!status || typeof status !== 'object') {
                    throw new Error('The approval status could not be found. Return to your sign-up status page.');
                }
                if (status.status === 'pending') {
                    showMessage(user.emailVerified
                        ? 'Your email is verified. Admin access will be activated after Main Admin approval.'
                        : 'Your request is waiting for Main Admin approval. Verify your email using the link we sent.', false);
                    return;
                }
                if (status.status !== 'approved') {
                    throw new Error('This admin request was ' + status.status + '. Submit a new request if needed.');
                }
                if (!user.emailVerified) {
                    showMessage('Your request is approved. Verify your email to activate admin access.', false);
                    return;
                }

                await user.getIdToken(true);
                const requestSnapshot = await db.ref(`pending_admin_requests/${reqId}`).once('value');
                const request = requestSnapshot.val();
                if (!request || request.status !== 'approved' ||
                    request.email.toLowerCase() !== user.email.toLowerCase()) {
                    throw new Error('This approved request does not match the verified email address.');
                }

                const profileRef = db.ref(`admins/${user.uid}`);
                const profileSnapshot = await profileRef.once('value');
                if (!profileSnapshot.exists()) {
                    await profileRef.set({
                        requestId: reqId,
                        name: request.name,
                        position: request.position,
                        department: request.department,
                        email: user.email,
                        role: 'admin',
                        approvedBy: request.resolvedBy || 'Main Admin',
                        approvedAt: request.approvedAt
                    });
                }
                document.getElementById('account-form').classList.add('hidden');
                document.getElementById('login-link').classList.remove('hidden');
                showMessage('Your email is verified and admin access is active.', false);
            } catch (error) {
                console.error(error);
                showMessage('Could not finish account setup: ' + error.message, true);
            } finally {
                provisioning = false;
                submitButton.disabled = false;
            }
        }

        auth.onAuthStateChanged(async (user) => {
            if (!user) return;
            try {
                await user.reload();
                const refreshedUser = auth.currentUser;
                if (refreshedUser) await provisionVerifiedAccount(refreshedUser);
            } catch (error) {
                console.error(error);
                showMessage('Could not check email verification: ' + error.message, true);
            }
        });

        if (reqId && /^[A-Za-z0-9_-]+$/.test(reqId)) {
            db.ref(`pending_admin_status/${reqId}`).on('value', async (snapshot) => {
                if (snapshot.val() && snapshot.val().status === 'approved' && auth.currentUser) {
                    try {
                        await auth.currentUser.reload();
                        if (auth.currentUser) await provisionVerifiedAccount(auth.currentUser);
                    } catch (error) {
                        console.error(error);
                        showMessage('Could not check account status: ' + error.message, true);
                    }
                }
            });
        }

        document.getElementById('account-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!reqId || !/^[A-Za-z0-9_-]+$/.test(reqId)) {
                return showMessage('The approval link is missing or invalid. Return to your approval status page.', true);
            }

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            if (!password) return showMessage('Enter the password you set during sign-up.', true);

            submitButton.disabled = true;
            try {
                let user = auth.currentUser;
                if (user && user.email.toLowerCase() !== email) {
                    await auth.signOut();
                    user = null;
                }
                if (!user) {
                    try {
                        const credential = await auth.signInWithEmailAndPassword(email, password);
                        user = credential.user;
                    } catch (error) {
                        if (error.code !== 'auth/user-not-found') throw error;
                        if (!passwordIsStrong(password)) {
                            throw new Error('Password must be at least 8 characters with a letter, number, and symbol.');
                        }
                        const credential = await auth.createUserWithEmailAndPassword(email, password);
                        user = credential.user;
                    }
                }

                if (user.email.toLowerCase() !== email) {
                    throw new Error('Sign in with the email address from the approved request.');
                }
                if (!user.emailVerified) {
                    const continueUrl = new URL(`CreateAccount.html?req=${encodeURIComponent(reqId)}`, window.location.href).href;
                    await user.sendEmailVerification({ url: continueUrl });
                    showMessage('Check your email and verify the address. Admin access activates after approval.', false);
                } else {
                    await provisionVerifiedAccount(user);
                }
            } catch (error) {
                console.error(error);
                showMessage('Could not finish account setup: ' + error.message, true);
                submitButton.disabled = false;
            }
        });
    </script>
</body>

</html>
